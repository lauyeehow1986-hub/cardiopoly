<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cardiopoly Cut-In Video Generator</title>
  <style>
    body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
    canvas { border: 1px solid #333; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Cardiopoly Cut-In Video Renderer</h1>
  <div id="status">Initializing...</div>
  <canvas id="c" width="640" height="360"></canvas>

  <script>
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const CUTINS = [
      {
        id: 'code_blue',
        img: '/assets/images/cutins/code_blue.jpg',
        title: 'CODE BLUE HOSPITALIZATION',
        subtitle: 'VENTRICULAR FIBRILLATION RESUSCITATION',
        theme: 'crimson',
        accent: '#ef4444'
      },
      {
        id: 'cath_lab',
        img: '/assets/images/cutins/cath_lab.jpg',
        title: 'HIGH-RISK CATH / STENT DEPLOYED',
        subtitle: 'CORONARY INTERVENTION ACTIVE',
        theme: 'cyan',
        accent: '#06b6d4'
      },
      {
        id: 'regulatory_audit',
        img: '/assets/images/cutins/regulatory_audit.jpg',
        title: 'REGULATORY CLAWBACK & AUDIT',
        subtitle: 'MINISTRY BILLING AUDIT ENFORCED',
        theme: 'amber',
        accent: '#f59e0b'
      }
    ];

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function recordCutIn(config) {
      statusEl.textContent = `Loading image for ${config.id}...`;
      const img = await loadImage(config.img);
      statusEl.textContent = `Rendering and recording 5s snippet for ${config.id}...`;

      const stream = canvas.captureStream(30);
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8') 
        ? 'video/webm;codecs=vp8' 
        : 'video/webm';

      const recorder = new MediaRecorder(stream, {
        mimeType: mime,
        videoBitsPerSecond: 1800000
      });

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      const completionPromise = new Promise((resolve) => {
        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const reader = new FileReader();
          reader.onloadend = async () => {
            const base64 = reader.result.split(',')[1];
            await fetch(`/upload-video?id=${config.id}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: config.id, data: base64 })
            });
            resolve();
          };
          reader.readAsDataURL(blob);
        };
      });

      recorder.start();

      const totalFrames = 150; // 5 seconds at 30fps
      for (let frame = 0; frame < totalFrames; frame++) {
        const progress = frame / totalFrames; // 0.0 -> 1.0

        // 1. Camera Zoom / Ken Burns effect (1.0 -> 1.15)
        const scale = 1.0 + progress * 0.15;
        const panX = Math.sin(progress * Math.PI) * 15;
        const panY = Math.cos(progress * Math.PI) * 8;

        ctx.save();
        ctx.clearRect(0, 0, 640, 360);

        // Center zoom
        ctx.translate(320 + panX, 180 + panY);
        ctx.scale(scale, scale);
        ctx.drawImage(img, -320, -180, 640, 360);
        ctx.restore();

        // 2. Cinematic Vignette & Ambient Pulses
        const vigGrad = ctx.createRadialGradient(320, 180, 120, 320, 180, 360);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
        vigGrad.addColorStop(1, 'rgba(0,0,0,0.65)');
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, 640, 360);

        // 3. Thematic Visual FX
        if (config.theme === 'crimson') {
          // Emergency Red Flashing Strobe
          const strobe = (Math.sin(progress * 25) + 1) * 0.5; // fast pulse
          ctx.fillStyle = `rgba(239, 68, 68, ${strobe * 0.22})`;
          ctx.fillRect(0, 0, 640, 360);

          // V-Fib ECG wave at bottom
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let x = 0; x < 640; x += 4) {
            const phase = x * 0.05 + progress * 20;
            const y = 320 + Math.sin(phase) * (Math.random() * 20 + 10);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        } else if (config.theme === 'cyan') {
          // High-tech Cyan Grid Sweep
          const sweepY = (progress * 720) % 360;
          const sweepGrad = ctx.createLinearGradient(0, sweepY - 40, 0, sweepY + 40);
          sweepGrad.addColorStop(0, 'rgba(6, 182, 212, 0)');
          sweepGrad.addColorStop(0.5, 'rgba(6, 182, 212, 0.28)');
          sweepGrad.addColorStop(1, 'rgba(6, 182, 212, 0)');
          ctx.fillStyle = sweepGrad;
          ctx.fillRect(0, 0, 640, 360);

          // Guidewire stent mesh grid lines
          ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
          ctx.lineWidth = 1;
          for (let gx = 0; gx < 640; gx += 40) {
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 360); ctx.stroke();
          }
        } else if (config.theme === 'amber') {
          // Regulatory Audit Caution Bars & Stamp shockwave
          const cautionOffset = (progress * 150) % 40;
          ctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
          ctx.fillRect(0, 0, 640, 360);

          // Border caution stripes top/bottom
          ctx.fillStyle = 'rgba(245, 158, 11, 0.35)';
          ctx.fillRect(0, 0, 640, 6);
          ctx.fillRect(0, 354, 640, 6);
        }

        // 4. Scanlines
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        for (let sl = 0; sl < 360; sl += 4) {
          ctx.fillRect(0, sl, 640, 1.5);
        }

        // 5. Cinematic Letterbox Bars
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 640, 38);
        ctx.fillRect(0, 322, 640, 38);

        // 6. Cut-In Title HUD
        ctx.fillStyle = config.accent;
        ctx.font = 'bold 11px monospace';
        ctx.letterSpacing = '2px';
        ctx.fillText('LIVE CLINICAL EVENT // 100% EVIDENCE RESOLUTION', 24, 25);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(config.title, 24, 344);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px monospace';
        ctx.fillText(config.subtitle, 400, 344);

        // Frame rate delay
        await new Promise(r => setTimeout(r, 33));
      }

      recorder.stop();
      await completionPromise;
      statusEl.textContent = `Completed ${config.id}!`;
    }

    async function runAll() {
      for (const config of CUTINS) {
        await recordCutIn(config);
      }
      statusEl.textContent = 'ALL_VIDEOS_RENDERED_SUCCESSFULLY';
      window.__ALL_VIDEOS_RENDERED = true;
    }

    runAll().catch(err => {
      console.error(err);
      statusEl.textContent = 'ERROR: ' + err.message;
      window.__VIDEO_RENDER_ERROR = err.message;
    });
  </script>
</body>
</html>
